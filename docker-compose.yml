services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/control_plane.db
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-development-only}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes: [control-plane-data:/data]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  control-plane-data:
